version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
        - cp userscript/*.user.js dist/
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: "**/*"
      headers:
        - key: Access-Control-Allow-Origin
          value: "*"
        - key: Access-Control-Allow-Methods
          value: "GET, OPTIONS"
    - pattern: "*.user.js"
      headers:
        - key: Content-Type
          value: text/javascript
